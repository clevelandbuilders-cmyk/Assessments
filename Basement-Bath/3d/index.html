<script type="module">
import * as THREE from 'three';

const P = new URLSearchParams(location.search);
let W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1);

// ---------- procedural textures (1 unit = 1 inch) ----------
function canvasTex(w,h,draw,repX=1,repY=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repX,repY);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
function rnd(s){return ()=>{s=(s*16807)%2147483647;return s/2147483647;}}
// charcoal stone-look porcelain: 24x48 tiles, veining
function stoneDraw(base, vein, seed){return (g,w,h)=>{const r=rnd(seed);
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const v=r();g.fillStyle=`rgba(${v>.5?255:0},${v>.5?255:0},${v>.5?255:0},${r()*0.035})`;g.fillRect(r()*w,r()*h,2+r()*6,2+r()*6);}
  g.strokeStyle=vein;for(let k=0;k<14;k++){g.lineWidth=0.6+r()*1.6;g.globalAlpha=0.08+r()*0.18;g.beginPath();let x=r()*w,y=0;g.moveTo(x,y);while(y<h){x+= (r()-.5)*40;y+=10+r()*30;g.lineTo(x,y);}g.stroke();}
  g.globalAlpha=1;g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=2;g.strokeRect(1,1,w-2,h-2);};}
const stoneTex=(rx,ry,seed=7)=>canvasTex(256,512,stoneDraw('#2b2a29','#8a8580',seed),rx,ry);
const floorTex=(rx,ry)=>canvasTex(512,256,(g,w,h)=>{stoneDraw('#262524','#77716b',3)(g,w,h);},rx,ry);
// cedar boards (vertical, 5.5" wide)
function cedarDraw(g,w,h){const r=rnd(11);const bw=w/4;for(let b=0;b<4;b++){const hue=[ '#b8794a','#c58a55','#a96c40','#bf8350'][Math.floor(r()*4)];g.fillStyle=hue;g.fillRect(b*bw,0,bw,h);
  for(let i=0;i<40;i++){g.strokeStyle=`rgba(90,45,20,${0.08+r()*0.15})`;g.lineWidth=0.5+r()*1.5;g.beginPath();let x=b*bw+r()*bw;g.moveTo(x,0);for(let y=0;y<h;y+=16){x+=(r()-.5)*2;g.lineTo(x,y);}g.stroke();}
  if(r()<.4){g.fillStyle='rgba(70,30,10,.35)';g.beginPath();g.ellipse(b*bw+r()*bw,r()*h,4,7,0,0,7);g.fill();}
  g.fillStyle='rgba(40,18,6,.7)';g.fillRect(b*bw,0,2,h);}}
const cedarTex=(rx,ry)=>canvasTex(256,1024,cedarDraw,rx,ry);
const cedarHTex=(rx,ry)=>{const t=canvasTex(256,1024,cedarDraw,rx,ry);t.rotation=Math.PI/2;return t;};
function walnutDraw(g,w,h){const r=rnd(5);g.fillStyle='#4a2e1c';g.fillRect(0,0,w,h);for(let i=0;i<120;i++){g.strokeStyle=`rgba(${r()<.5?20:110},${r()<.5?10:70},${r()<.5?5:40},${0.1+r()*0.2})`;g.lineWidth=0.5+r()*2;g.beginPath();let y=r()*h;g.moveTo(0,y);for(let x=0;x<w;x+=20){y+=(r()-.5)*3;g.lineTo(x,y);}g.stroke();}}
const walnutTex=(rx,ry)=>canvasTex(1024,256,walnutDraw,rx,ry);

const M = (o)=>new THREE.MeshStandardMaterial(o);
const mats = {
  wallDark: M({color:'#2a2826',roughness:.95}),
  ceil: M({color:'#151413',roughness:1}),
  black: M({color:'#0d0d0d',roughness:.45,metalness:.6}),
  matteBlack: M({color:'#111',roughness:.6,metalness:.3}),
  brass: M({color:'#b8894a',roughness:.32,metalness:1}),
  china: M({color:'#0b0b0b',roughness:.25,metalness:.0}),
  heater: M({color:'#1a1a1a',roughness:.5,metalness:.7}),
  stones: M({color:'#4a4744',roughness:1}),
  glass: new THREE.MeshPhysicalMaterial({color:'#b8c4c4',metalness:0,roughness:0.03,transparent:true,opacity:.14,envMapIntensity:3,side:THREE.DoubleSide,depthWrite:false}),
  frame: M({color:'#0a0a0a',roughness:.4,metalness:.8}),
  glowWarm: new THREE.MeshBasicMaterial({color:new THREE.Color(1.0,0.62,0.30).multiplyScalar(4)}),
  glowSoft: new THREE.MeshBasicMaterial({color:new THREE.Color(1.0,0.66,0.36).multiplyScalar(2.2)}),
  daylight: new THREE.MeshBasicMaterial({map:canvasTex(64,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#9fb4c4');gr.addColorStop(.6,'#c9c2b0');gr.addColorStop(1,'#6d6a55');g.fillStyle=gr;g.fillRect(0,0,w,h);}),color:new THREE.Color(.55,.55,.55)}),
};
function box(w,h,d,mat,x,y,z,opts={}){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x+w/2,y+h/2,z+d/2);m.castShadow=opts.cast!==false;m.receiveShadow=true;scene.add(m);return m;}
function planeX(z0,z1,y0,y1,x,mat,facing){const g=new THREE.PlaneGeometry(z1-z0,y1-y0);const m=new THREE.Mesh(g,mat);m.rotation.y=facing>0?Math.PI/2:-Math.PI/2;m.position.set(x,(y0+y1)/2,(z0+z1)/2);m.receiveShadow=true;scene.add(m);return m;}
function planeZ(x0,x1,y0,y1,z,mat,facing){const g=new THREE.PlaneGeometry(x1-x0,y1-y0);const m=new THREE.Mesh(g,mat);if(facing<0)m.rotation.y=Math.PI;m.position.set((x0+x1)/2,(y0+y1)/2,z);m.receiveShadow=true;scene.add(m);return m;}

box(42,26,1.2,mats.frame,13,44,0.0);

const winL=new THREE.RectAreaLight(0xd8e4f0,2.2,38,22);winL.position.set(34,57,1.5);winL.lookAt(34,57,40);scene.add(winL);

// ---------- STEAM SHOWER: x 72..126, z 0..66 ----------
const sTile=(rx,ry,s)=>M({map:stoneTex(rx,ry,s),roughness:.25,metalness:0,envMapIntensity:1.2});

const nl=new THREE.RectAreaLight(0xffa860,9,40,3);nl.position.set(R-2,55,33);nl.lookAt(R-2,42,33);scene.add(nl);
const nl2=new THREE.PointLight(0xff9a50,1400,50,2);const sfill=new THREE.PointLight(0xffb070,700,90,2);sfill.position.set(80,70,33);scene.add(sfill);nl2.position.set(R-6,52,33);scene.add(nl2);
// bottles in niche
for(const [zz,h,c] of [[19,8,'#111'],[23,9.5,'#111'],[27,7,'#c9a26a']]){const b=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,h,20),M({color:c,roughness:.3,metalness:c=='#111'?.2:.8}));b.position.set(R-2.2,42+h/2,zz);b.castShadow=true;scene.add(b);}
// rain head 14" round, toward bench end
const arm=box(1,7,1,mats.black,98.5,EH-7,24);

// slide bar + valve on back wall near partition end
box(1.2,30,1.2,mats.black,R-2,36,58);
const hs=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1,4,20),mats.black);hs.rotation.z=Math.PI/2;hs.position.set(R-4,62,58.6);scene.add(hs);
box(.6,7,5,mats.black,R-.6,40,52);const knob=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.1,2.5,24),mats.black);knob.rotation.z=Math.PI/2;knob.position.set(R-1.8,44,54.5);scene.add(knob);
// linear drain along back wall
box(1.5,.2,40,mats.black,R-3,0.45,14);

box(1.5,1.5,4,mats.black,R-1.5,10,4);

// ---------- PARTITION z 66..69.5 front edge ----------
box(54,EH,3.5,mats.wallDark,GX,0,66);
box(3.5,EH,3.5,mats.frame,GX-1,0,66);

// ---------- SAUNA: x 72..126, z 69.5..126 ----------
const cd=(rx,ry)=>M({map:cedarTex(rx,ry),roughness:.75});
planeX(69.5,R,0,EH,R,cd(56/22,1),-1);   // back wall
planeZ(GX,R,0,EH,69.5,cd(54/22,1),1);    // partition side
planeZ(GX,R,0,EH,R,cd(54/22,1),-1);      // door-wall end
const sauC=new THREE.Mesh(new THREE.PlaneGeometry(54,56.5),M({map:cedarTex(56/22,1),roughness:.75}));sauC.rotation.x=Math.PI/2;sauC.position.set(99,EH,97.75);scene.add(sauC);
const sauF=new THREE.Mesh(new THREE.PlaneGeometry(54,56.5),M({color:'#262321',roughness:.8}));sauF.rotation.x=-Math.PI/2;sauF.position.set(99,0.3,97.75);scene.add(sauF);
// benches along back wall: upper 42" (22 deep), lower 24" (20 deep). upper stops short of heater.
const bm=M({map:cedarHTex(1,3),roughness:.7,color:'#d79a62'});
function slats(x0,depth,y,z0,z1){const n=Math.floor(depth/4.2);for(let i=0;i<n;i++){box(3.6,1.4,z1-z0,bm,x0+i*4.2,y-1.4,z0);}box(depth,4,1.2,bm,x0,y-5.4,z0);}

box(20,3.5,34,bm,R-42,20.5-3,69.5,{cast:false});
// backrest slats
for(let y=50;y<74;y+=5) box(1.2,3.4,56,bm,R-1.4,y,69.5);
// LED under bench lips
const u1=new THREE.Mesh(new THREE.PlaneGeometry(55,1),mats.glowWarm);u1.rotation.y=-Math.PI/2;u1.rotation.x=0;u1.position.set(R-22.6,36.5,97.75);scene.add(u1);
const u2=new THREE.Mesh(new THREE.PlaneGeometry(34,1),mats.glowWarm);u2.rotation.y=-Math.PI/2;u2.position.set(R-42.6,18.5,86.5);scene.add(u2);
const ul1=new THREE.RectAreaLight(0xff9a48,10,55,4);ul1.position.set(R-23,36,97.75);ul1.lookAt(R-23,0,97.75);scene.add(ul1);
const ul2=new THREE.RectAreaLight(0xff9a48,10,34,4);ul2.position.set(R-43,18,86.5);ul2.lookAt(R-43,0,86.5);scene.add(ul2);
const sp=new THREE.PointLight(0xffa25a,1800,90,2);sp.position.set(100,70,100);sp.castShadow=true;scene.add(sp);

box(1.2,24,1.2,mats.black,GX-2.2,30,61);

box(.8,EH,.6,mats.frame,GX-.4,0,100);box(.8,EH,.6,mats.frame,GX-.4,0,124);
box(1.5,24,2,bm,GX-2.5,30,102);

// fluted charcoal accent z 54..126 full height

for(let z=56;z<124;z+=2.5){const f=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,CH,10,1,false,0,Math.PI),fluteMat);f.rotation.y=Math.PI;f.position.set(0.1,CH/2,z+1.25);f.receiveShadow=true;f.castShadow=false;scene.add(f);}

box(21,12,48,wm,1.5,22,66);
box(21,1.5,48,M({map:walnutTex(1,1),roughness:.35,color:'#7a5236'}),1.5,34,66);
// drawer seams
box(.2,.4,46,M({color:'#1c120b'}),22.5,28,67);
// under-vanity glow
const vg=new THREE.Mesh(new THREE.PlaneGeometry(46,.8),mats.glowWarm);vg.rotation.x=Math.PI/2;vg.rotation.z=Math.PI/2;vg.position.set(12,21.9,90);scene.add(vg);

// vessel sinks (black), faucets (brass wall-mount)
for(const zc of [78,102]){
  const pts=[];for(let i=0;i<=16;i++){const t=i/16;pts.push(new THREE.Vector2(3+ (8)*Math.sin(t*Math.PI/2),t*5.5));}
  const vs=new THREE.Mesh(new THREE.LatheGeometry(pts,48),mats.china);vs.position.set(12,35.5,zc);vs.castShadow=true;scene.add(vs);
  const sp=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,9,16),mats.brass);sp.rotation.z=Math.PI/2;sp.position.set(4.5,47,zc);scene.add(sp);
  const esc=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,.5,24),mats.brass);esc.rotation.z=Math.PI/2;esc.position.set(.6,47,zc);scene.add(esc);
  const hd=new THREE.Mesh(new THREE.CylinderGeometry(.8,.8,2,16),mats.brass);hd.rotation.z=Math.PI/2;hd.position.set(1.4,47,zc+4.5);scene.add(hd);
